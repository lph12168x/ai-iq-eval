<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8f5"/>
      <stop offset="1" stop-color="#e9f7ee"/>
    </linearGradient>
  </defs>

  <!-- ===== background ===== -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="665" cy="88" r="42" fill="#ffd75e"/>
  <circle cx="665" cy="88" r="55" fill="#ffd75e" opacity="0.3"/>

  <!-- clouds drift right-to-left -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="0" cy="90" rx="46" ry="18"/>
      <ellipse cx="32" cy="78" rx="30" ry="15"/>
      <ellipse cx="-28" cy="80" rx="26" ry="13"/>
      <animateTransform attributeName="transform" type="translate" from="880 0" to="-160 0" dur="26s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="150" rx="36" ry="14"/>
      <ellipse cx="24" cy="140" rx="22" ry="11"/>
      <animateTransform attributeName="transform" type="translate" from="880 0" to="-160 0" dur="38s" begin="-16s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- static decorative cloud -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="185" cy="105" rx="44" ry="17"/>
    <ellipse cx="215" cy="93" rx="28" ry="14"/>
    <ellipse cx="158" cy="95" rx="24" ry="12"/>
  </g>

  <!-- hills -->
  <path d="M-20,430 Q160,320 360,430 Z" fill="#bfe3a8"/>
  <path d="M280,430 Q520,330 780,430 Z" fill="#a9d693"/>

  <!-- road -->
  <rect x="0" y="428" width="800" height="72" fill="#5b6572"/>
  <rect x="0" y="424" width="800" height="6" fill="#7f8a97"/>
  <line x1="0" y1="468" x2="800" y2="468" stroke="#f7d774" stroke-width="6" stroke-dasharray="52 40">
    <animate attributeName="stroke-dashoffset" from="0" to="-92" dur="0.24s" repeatCount="indefinite"/>
  </line>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="320" x2="70" y2="320"/>
    <line x1="130" y1="355" x2="40" y2="355"/>
    <line x1="160" y1="395" x2="70" y2="395"/>
    <animate attributeName="opacity" values="0.75;0.15;0.75" dur="0.5s" repeatCount="indefinite"/>
  </g>

  <!-- shadow -->
  <ellipse cx="385" cy="434" rx="165" ry="11" fill="#000000" opacity="0.16"/>

  <!-- ===== bicycle ===== -->
  <!-- rear wheel -->
  <g>
    <circle cx="260" cy="370" r="58" fill="none" stroke="#26262b" stroke-width="8"/>
    <circle cx="260" cy="370" r="7" fill="#26262b"/>
    <g stroke="#9aa0a8" stroke-width="2.5">
      <line x1="260" y1="314" x2="260" y2="426"/>
      <line x1="204" y1="370" x2="316" y2="370"/>
      <line x1="220" y1="330" x2="300" y2="410"/>
      <line x1="300" y1="330" x2="220" y2="410"/>
      <animateTransform attributeName="transform" type="rotate" from="0 260 370" to="360 260 370" dur="0.9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- chain -->
  <line x1="380" y1="360" x2="260" y2="356" stroke="#3a3a3f" stroke-width="3"/>
  <line x1="380" y1="390" x2="260" y2="384" stroke="#3a3a3f" stroke-width="3"/>

  <!-- frame -->
  <g stroke="#e0393e" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="380" y1="375" x2="386" y2="296"/>   <!-- seat tube -->
    <line x1="386" y1="298" x2="463" y2="304"/>   <!-- top tube -->
    <line x1="380" y1="375" x2="461" y2="306"/>   <!-- down tube -->
    <line x1="380" y1="375" x2="260" y2="370"/>   <!-- chainstay -->
    <line x1="386" y1="298" x2="260" y2="370"/>   <!-- seat stay -->
  </g>
  <circle cx="380" cy="375" r="14" fill="none" stroke="#3a3a3f" stroke-width="4"/> <!-- chainring -->

  <!-- far crank arm -->
  <line x1="380" y1="375" x2="345" y2="375" stroke="#2c2c31" stroke-width="6" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 380 375" to="360 380 375" dur="0.9s" repeatCount="indefinite"/>
  </line>

  <!-- ===== pelican: far leg (behind body, darker) ===== -->
  <path fill="none" stroke="#b0641e" stroke-width="9" stroke-linecap="round">
    <animate attributeName="d" dur="0.9s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"
      values="M388,288 Q356,332 345,375;
              M388,288 Q350,352 380,340;
              M388,288 Q398,332 415,375;
              M388,288 Q362,362 380,410;
              M388,288 Q356,332 345,375"/>
  </path>
  <ellipse cx="345" cy="375" fill="#b0641e" rx="11" ry="5">
    <animate attributeName="cx" dur="0.9s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="345;380;415;380;345"/>
    <animate attributeName="cy" dur="0.9s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="375;340;375;410;375"/>
  </ellipse>

  <!-- ===== pelican body (bobbing group) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 3;0 0" dur="0.45s" repeatCount="indefinite"/>

    <!-- tail -->
    <path d="M352,238 L308,220 L322,246 L304,252 L340,264 Z" fill="#f3edde" stroke="#d8d0bc" stroke-width="2"/>

    <!-- body -->
    <ellipse cx="392" cy="250" rx="56" ry="40" fill="#faf5e8" stroke="#d8d0bc" stroke-width="2.5" transform="rotate(-8 392 250)"/>

    <!-- neck -->
    <path d="M420,232 Q424,196 456,180" fill="none" stroke="#faf5e8" stroke-width="19" stroke-linecap="round"/>
    <path d="M420,232 Q424,196 456,180" fill="none" stroke="#d8d0bc" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>

    <!-- head -->
    <circle cx="460" cy="176" r="24" fill="#faf5e8" stroke="#d8d0bc" stroke-width="2.5"/>

    <!-- pouch (under lower beak) -->
    <path d="M478,186 Q504,236 566,198 Q516,206 480,180 Z" fill="#f0a13c" stroke="#d4862a" stroke-width="2"/>

    <!-- upper beak -->
    <path d="M476,164 L572,196 L482,186 Z" fill="#f5a623" stroke="#d4862a" stroke-width="2" stroke-linejoin="round"/>

    <!-- eye -->
    <circle cx="463" cy="167" r="3.6" fill="#232323"/>
    <circle cx="464.3" cy="165.7" r="1.2" fill="#ffffff"/>

    <!-- wing reaching the handlebar -->
    <path d="M378,232 Q420,242 452,276 Q418,266 374,254 Z" fill="#efe7d4" stroke="#d8d0bc" stroke-width="2"/>
  </g>

  <!-- ===== pelican: near leg + webbed foot ===== -->
  <path fill="none" stroke="#e8842a" stroke-width="9" stroke-linecap="round">
    <animate attributeName="d" dur="0.9s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"
      values="M400,288 Q430,332 415,375;
              M400,288 Q418,356 380,410;
              M400,288 Q370,332 345,375;
              M400,288 Q428,318 380,340;
              M400,288 Q430,332 415,375"/>
  </path>
  <ellipse cx="415" cy="375" fill="#e8842a" rx="12" ry="5.5">
    <animate attributeName="cx" dur="0.9s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="415;380;345;380;415"/>
    <animate attributeName="cy" dur="0.9s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1" values="375;410;375;340;375"/>
  </ellipse>

  <!-- near crank arm + pedals (in front of leg) -->
  <g>
    <line x1="380" y1="375" x2="415" y2="375" stroke="#2c2c31" stroke-width="6" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 380 375" to="360 380 375" dur="0.9s" repeatCount="indefinite"/>
  </g>

  <!-- seat + fork + handlebar (in front of body) -->
  <rect x="368" y="288" width="36" height="9" rx="4" fill="#2c2c31"/>
  <line x1="461" y1="306" x2="500" y2="370" stroke="#e0393e" stroke-width="9" stroke-linecap="round"/>
  <line x1="465" y1="302" x2="458" y2="282" stroke="#e0393e" stroke-width="8" stroke-linecap="round"/>
  <line x1="444" y1="281" x2="474" y2="281" stroke="#2c2c31" stroke-width="7" stroke-linecap="round"/>

  <!-- front wheel -->
  <g>
    <circle cx="500" cy="370" r="58" fill="none" stroke="#26262b" stroke-width="8"/>
    <circle cx="500" cy="370" r="7" fill="#26262b"/>
    <g stroke="#9aa0a8" stroke-width="2.5">
      <line x1="500" y1="314" x2="500" y2="426"/>
      <line x1="444" y1="370" x2="556" y2="370"/>
      <line x1="460" y1="330" x2="540" y2="410"/>
      <line x1="540" y1="330" x2="460" y2="410"/>
      <animateTransform attributeName="transform" type="rotate" from="0 500 370" to="360 500 370" dur="0.9s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
