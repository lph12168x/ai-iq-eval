<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <title>Pelican Riding a Bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#81d4fa"/>
      <stop offset="1" stop-color="#e1f5fe"/>
    </linearGradient>
  </defs>

  <!-- ===== Sky, sun, clouds, hills ===== -->
  <rect x="0" y="0" width="900" height="600" fill="url(#sky)"/>

  <g>
    <g stroke="#ffd54f" stroke-width="4" stroke-linecap="round">
      <line x1="90" y1="48" x2="90" y2="28"/>
      <line x1="90" y1="48" x2="90" y2="28" transform="rotate(45 90 90)"/>
      <line x1="90" y1="48" x2="90" y2="28" transform="rotate(90 90 90)"/>
      <line x1="90" y1="48" x2="90" y2="28" transform="rotate(135 90 90)"/>
      <line x1="90" y1="48" x2="90" y2="28" transform="rotate(180 90 90)"/>
      <line x1="90" y1="48" x2="90" y2="28" transform="rotate(225 90 90)"/>
      <line x1="90" y1="48" x2="90" y2="28" transform="rotate(270 90 90)"/>
      <line x1="90" y1="48" x2="90" y2="28" transform="rotate(315 90 90)"/>
    </g>
    <animateTransform attributeName="transform" type="rotate" from="0 90 90" to="360 90 90" dur="40s" repeatCount="indefinite"/>
  </g>
  <circle cx="90" cy="90" r="34" fill="#ffd54f" stroke="#ffca28" stroke-width="3"/>
  <circle cx="80" cy="82" r="6" fill="#fff3c4" opacity="0.8"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.92">
    <g>
      <animateTransform attributeName="transform" type="translate" values="1040 110; -320 110" dur="26s" begin="-6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="42" ry="18"/>
      <ellipse cx="-30" cy="7" rx="26" ry="13"/>
      <ellipse cx="28" cy="8" rx="30" ry="14"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1040 185; -320 185" dur="34s" begin="-20s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="36" ry="15"/>
      <ellipse cx="-26" cy="6" rx="22" ry="11"/>
      <ellipse cx="24" cy="7" rx="25" ry="12"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1040 70; -320 70" dur="21s" begin="-13s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="30" ry="13"/>
      <ellipse cx="-22" cy="5" rx="18" ry="10"/>
      <ellipse cx="20" cy="6" rx="21" ry="10"/>
    </g>
  </g>

  <!-- hills -->
  <ellipse cx="180" cy="560" rx="280" ry="62" fill="#c8e6c9" opacity="0.85"/>
  <ellipse cx="700" cy="566" rx="320" ry="72" fill="#a5d6a7" opacity="0.75"/>

  <!-- ground -->
  <rect x="0" y="533" width="900" height="67" fill="#aed581"/>
  <line x1="0" y1="535" x2="900" y2="535" stroke="#7cb342" stroke-width="6"/>
  <line x1="0" y1="533" x2="900" y2="533" stroke="#fffde7" stroke-width="4" stroke-dasharray="36 34">
    <animate attributeName="stroke-dashoffset" values="0; -70" dur="0.8s" repeatCount="indefinite"/>
  </line>

  <!-- soft shadow under bike -->
  <ellipse cx="440" cy="540" rx="225" ry="11" fill="#000000" opacity="0.08"/>

  <!-- ===== far leg (behind bike frame) ===== -->
  <g>
    <path fill="none" stroke="#ef6c00" stroke-width="8" stroke-linecap="round"
          d="M360,315 Q374.5,367.5 357,440">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="M360,315 Q374.5,367.5 357,440;
                M360,315 Q380.1,354.1 368.1,413.1;
                M360,315 Q393.5,348.5 395,402;
                M360,315 Q406.9,354.1 421.9,413.1;
                M360,315 Q412.5,367.5 433,440;
                M360,315 Q406.9,380.9 421.9,466.9;
                M360,315 Q393.5,386.5 395,478;
                M360,315 Q380.1,380.9 368.1,466.9;
                M360,315 Q374.5,367.5 357,440"/>
    </path>
    <ellipse fill="#ef6c00" stroke="#d84315" stroke-width="1.5" rx="13" ry="6" cx="363" cy="440">
      <animate attributeName="cx" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="363;374.1;401;427.9;439;427.9;401;374.1;363"/>
      <animate attributeName="cy" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="440;413.1;402;413.1;440;466.9;478;466.9;440"/>
    </ellipse>
  </g>

  <!-- ===== bicycle ===== -->
  <g>
    <!-- wheels -->
    <g>
      <circle cx="290" cy="455" r="75" fill="none" stroke="#37474f" stroke-width="9"/>
      <circle cx="290" cy="455" r="63" fill="none" stroke="#90a4ae" stroke-width="5"/>
      <g stroke="#78909c" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0 290 455" to="360 290 455" dur="0.8s" repeatCount="indefinite"/>
        <line x1="290" y1="455" x2="350" y2="455"/>
        <line x1="290" y1="455" x2="320" y2="506.96"/>
        <line x1="290" y1="455" x2="260" y2="506.96"/>
        <line x1="290" y1="455" x2="230" y2="455"/>
        <line x1="290" y1="455" x2="260" y2="403.04"/>
        <line x1="290" y1="455" x2="320" y2="403.04"/>
        <circle cx="235" cy="455" r="4" fill="#ffca28" stroke="none"/>
      </g>
      <circle cx="290" cy="455" r="7" fill="#455a64" stroke="#263238" stroke-width="2"/>
    </g>
    <g>
      <circle cx="590" cy="455" r="75" fill="none" stroke="#37474f" stroke-width="9"/>
      <circle cx="590" cy="455" r="63" fill="none" stroke="#90a4ae" stroke-width="5"/>
      <g stroke="#78909c" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0 590 455" to="360 590 455" dur="0.8s" repeatCount="indefinite"/>
        <line x1="590" y1="455" x2="650" y2="455"/>
        <line x1="590" y1="455" x2="620" y2="506.96"/>
        <line x1="590" y1="455" x2="560" y2="506.96"/>
        <line x1="590" y1="455" x2="530" y2="455"/>
        <line x1="590" y1="455" x2="560" y2="403.04"/>
        <line x1="590" y1="455" x2="620" y2="403.04"/>
        <circle cx="645" cy="455" r="4" fill="#ffca28" stroke="none"/>
      </g>
      <circle cx="590" cy="455" r="7" fill="#455a64" stroke="#263238" stroke-width="2"/>
    </g>

    <!-- far crank arm + pedal -->
    <line x1="395" y1="440" x2="357" y2="440" stroke="#37474f" stroke-width="6" stroke-linecap="round">
      <animate attributeName="x2" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="357;368.1;395;421.9;433;421.9;395;368.1;357"/>
      <animate attributeName="y2" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="440;413.1;402;413.1;440;466.9;478;466.9;440"/>
    </line>
    <circle cx="357" cy="440" r="5.5" fill="#263238">
      <animate attributeName="cx" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="357;368.1;395;421.9;433;421.9;395;368.1;357"/>
      <animate attributeName="cy" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="440;413.1;402;413.1;440;466.9;478;466.9;440"/>
    </circle>
    <circle cx="395" cy="440" r="14" fill="#546e7a" stroke="#263238" stroke-width="2"/>
    <circle cx="395" cy="440" r="5" fill="#263238"/>

    <!-- frame -->
    <g stroke="#e2574c" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="362" y1="300" x2="395" y2="440"/>
      <line x1="365" y1="305" x2="570" y2="325"/>
      <line x1="395" y1="440" x2="583" y2="372"/>
      <line x1="368" y1="308" x2="290" y2="455"/>
      <line x1="395" y1="440" x2="290" y2="455"/>
      <line x1="570" y1="325" x2="585" y2="368"/>
    </g>
    <line x1="585" y1="368" x2="590" y2="455" stroke="#78909c" stroke-width="6" stroke-linecap="round"/>
    <line x1="570" y1="325" x2="600" y2="316" stroke="#90a4ae" stroke-width="6" stroke-linecap="round"/>
    <line x1="575" y1="316" x2="630" y2="316" stroke="#90a4ae" stroke-width="6" stroke-linecap="round"/>
    <rect x="571" y="310" width="16" height="12" rx="4" fill="#263238"/>
    <rect x="613" y="310" width="16" height="12" rx="4" fill="#263238"/>
    <ellipse cx="360" cy="297" rx="21" ry="8" fill="#5d4037"/>

    <!-- near crank arm + pedal -->
    <line x1="395" y1="440" x2="433" y2="440" stroke="#37474f" stroke-width="6" stroke-linecap="round">
      <animate attributeName="x2" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="433;421.9;395;368.1;357;368.1;395;421.9;433"/>
      <animate attributeName="y2" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="440;466.9;478;466.9;440;413.1;402;413.1;440"/>
    </line>
    <circle cx="433" cy="440" r="5.5" fill="#263238">
      <animate attributeName="cx" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="433;421.9;395;368.1;357;368.1;395;421.9;433"/>
      <animate attributeName="cy" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="440;466.9;478;466.9;440;413.1;402;413.1;440"/>
    </circle>
  </g>

  <!-- ===== pelican rider ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="0.9s" repeatCount="indefinite"
      keyTimes="0;0.25;0.5;0.75;1" values="0 0; 0 -3.5; 0 0; 0 -2.5; 0 0"/>

    <!-- tail feathers -->
    <path d="M314,262 L272,236 L286,264 L268,262 L292,288 L284,292 Q306,298 324,288 Z"
          fill="#eceff1" stroke="#b0bec5" stroke-width="2" stroke-linejoin="round"/>

    <!-- back wing (flapping) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.5;1" values="-4 404 268; 9 404 268; -4 404 268"/>
      <path d="M400,262 Q345,252 310,292 Q356,316 408,300 Z"
            fill="#eceff1" stroke="#b0bec5" stroke-width="2" stroke-linejoin="round"/>
      <path d="M366,270 Q340,272 320,290" fill="none" stroke="#b0bec5" stroke-width="1.5"/>
    </g>

    <!-- neck -->
    <path d="M410,262 Q428,236 444,218 L464,228 Q440,248 426,272 Z"
          fill="#fdfdfd" stroke="#cfd8dc" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- body -->
    <ellipse cx="370" cy="282" rx="68" ry="50" fill="#fdfdfd" stroke="#cfd8dc" stroke-width="2.5"/>

    <!-- head -->
    <circle cx="448" cy="198" r="25" fill="#fdfdfd" stroke="#cfd8dc" stroke-width="2.5"/>

    <!-- helmet -->
    <path d="M420,198 A28,28 0 0 1 476,198 Z" fill="#e53935" stroke="#b71c1c" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="448" cy="198" rx="32" ry="5" fill="#e53935" stroke="#b71c1c" stroke-width="1.5"/>
    <path d="M424,210 Q448,236 472,212" fill="none" stroke="#b71c1c" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="436" cy="180" rx="9" ry="4" fill="#ff8a80" opacity="0.7" transform="rotate(-20 436 180)"/>

    <!-- propeller -->
    <line x1="448" y1="170" x2="448" y2="156" stroke="#78909c" stroke-width="3" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 448 154" to="360 448 154" dur="0.35s" repeatCount="indefinite"/>
      <ellipse cx="448" cy="154" rx="20" ry="4.5" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/>
      <ellipse cx="448" cy="154" rx="20" ry="4.5" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5" transform="rotate(90 448 154)"/>
    </g>
    <circle cx="448" cy="154" r="3.5" fill="#e53935"/>

    <!-- beak: upper mandible + pouch -->
    <path d="M470,190 L562,206 L558,216 L468,202 Z" fill="#ffb300" stroke="#ef6c00" stroke-width="2" stroke-linejoin="round"/>
    <path d="M468,202 C486,246 534,244 558,214 L556,206 C528,232 492,232 474,198 Z"
          fill="#ffcc80" stroke="#ef6c00" stroke-width="2" stroke-linejoin="round"/>
    <path d="M480,206 Q514,234 550,212" fill="none" stroke="#ef6c00" stroke-width="1.5"/>

    <!-- eye -->
    <circle cx="452" cy="191" r="4.5" fill="#263238"/>
    <circle cx="453.5" cy="189.5" r="1.5" fill="#ffffff"/>

    <!-- front wing reaching to handlebar grip -->
    <path d="M418,248 Q510,262 610,310 L614,324 Q508,288 430,272 Z"
          fill="#eceff1" stroke="#b0bec5" stroke-width="2" stroke-linejoin="round"/>

    <!-- near leg -->
    <path fill="none" stroke="#fb8c00" stroke-width="9.5" stroke-linecap="round"
          d="M375,320 Q420,370 433,440">
      <animate attributeName="d" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="M375,320 Q420,370 433,440;
                M375,320 Q414.4,383.4 421.9,466.9;
                M375,320 Q401,389 395,478;
                M375,320 Q387.6,383.4 368.1,466.9;
                M375,320 Q382,370 357,440;
                M375,320 Q387.6,356.6 368.1,413.1;
                M375,320 Q401,351 395,402;
                M375,320 Q414.4,356.6 421.9,413.1;
                M375,320 Q420,370 433,440"/>
    </path>
    <ellipse fill="#fb8c00" stroke="#e65100" stroke-width="1.5" rx="14" ry="6.5" cx="439" cy="440">
      <animate attributeName="cx" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="439;427.9;401;374.1;363;374.1;401;427.9;439"/>
      <animate attributeName="cy" dur="0.9s" repeatCount="indefinite"
        keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
        values="440;466.9;478;466.9;440;413.1;402;413.1;440"/>
    </ellipse>
  </g>

  <!-- grip held by wing, drawn on top -->
  <circle cx="615" cy="319" r="6.5" fill="#263238"/>
</svg>
