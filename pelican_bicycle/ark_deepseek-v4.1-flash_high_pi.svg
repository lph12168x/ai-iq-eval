<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
<title>Pelican riding a bicycle</title>
<desc>A pelican pedalling a bicycle. The wheels spin, the crank drives the pedals and both
two-segment legs are solved with inverse kinematics so the feet never leave the pedals.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7ec8f2"/><stop offset=".55" stop-color="#c9e9fb"/>
    <stop offset="1" stop-color="#f2fbff"/>
  </linearGradient>
  <radialGradient id="sunGlow">
    <stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/>
    <stop offset=".55" stop-color="#ffe27a" stop-opacity=".45"/>
    <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5b5f6b"/><stop offset="1" stop-color="#33363f"/>
  </linearGradient>
  <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".62" stop-color="#f3eee2"/>
    <stop offset="1" stop-color="#ddd4c1"/>
  </linearGradient>
  <linearGradient id="beak" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffc45c"/><stop offset="1" stop-color="#ef8b1f"/>
  </linearGradient>
  <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffdda8"/><stop offset="1" stop-color="#ee9c2c"/>
  </linearGradient>
  <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#43bdd0"/><stop offset="1" stop-color="#1c7a90"/>
  </linearGradient>
</defs>

<rect width="900" height="560" fill="url(#sky)"/>

