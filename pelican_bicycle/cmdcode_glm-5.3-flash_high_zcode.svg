<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <title>鹈鹕骑自行车</title>

  <style>
    .w1      { transform-origin: 285px 395px; animation: rot 0.9s linear infinite; }
    .w2      { transform-origin: 505px 395px; animation: rot 0.9s linear infinite; }
    .crank   { transform-origin: 370px 398px; animation: rot 0.9s linear infinite; }
    .pedalA  { transform-origin: 346px 398px; animation: rotBack 0.9s linear infinite; }
    .pedalB  { transform-origin: 394px 398px; animation: rotBack 0.9s linear infinite; }
    .bob     { animation: bob 0.9s ease-in-out infinite; }
    .wing    { transform-origin: 392px 240px; animation: flap 0.9s ease-in-out infinite; }
    .scarf   { transform-origin: 430px 210px; animation: scarf 0.55s ease-in-out infinite alternate; }
    .chain   { animation: chainMove 0.28s linear infinite; }
    .roadDash{ animation: dashMove 0.6s linear infinite; }
    .cloud1  { animation: drift 26s linear infinite; animation-delay: -6s; }
    .cloud2  { animation: drift 38s linear infinite; animation-delay: -22s; }
    .cloud3  { animation: drift 32s linear infinite; animation-delay: -14s; }
    .s1 { animation: speed 1.2s linear infinite; }
    .s2 { animation: speed 1.2s linear infinite 0.35s; }
    .s3 { animation: speed 1.2s linear infinite 0.7s; }

    @keyframes rot      { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
    @keyframes rotBack  { from { transform: rotate(0deg); }   to { transform: rotate(-360deg); } }
    @keyframes bob      { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes flap     { 0%,100% { transform: rotate(0deg); }  50% { transform: rotate(-5deg); } }
    @keyframes scarf    { from { transform: rotate(-7deg); }    to { transform: rotate(10deg); } }
    @keyframes chainMove{ to { stroke-dashoffset: -16; } }
    @keyframes dashMove { to { stroke-dashoffset: -140; } }
    @keyframes drift    { from { transform: translateX(850px); } to { transform: translateX(-260px); } }
    @keyframes speed    { 0% { opacity: 0; transform: translateX(40px); }
                          40% { opacity: 0.7; }
                          100% { opacity: 0; transform: translateX(-70px); } }
  </style>

  <!-- ======== 背景 ======== -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee3ff"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <circle cx="690" cy="85" r="38" fill="#ffd93d"/>
    <circle cx="690" cy="85" r="50" fill="#ffd93d" opacity="0.25"/>
  </g>

  <!-- 云 -->
  <g class="cloud1" opacity="0.95">
    <ellipse cx="0"   cy="95" rx="46" ry="20" fill="#ffffff"/>
    <ellipse cx="36"  cy="84" rx="36" ry="18" fill="#ffffff"/>
    <ellipse cx="70"  cy="96" rx="40" ry="15" fill="#ffffff"/>
  </g>
  <g class="cloud2" opacity="0.85">
    <ellipse cx="0"   cy="165" rx="38" ry="16" fill="#ffffff"/>
    <ellipse cx="30"  cy="156" rx="28" ry="14" fill="#ffffff"/>
    <ellipse cx="58"  cy="166" rx="32" ry="12" fill="#ffffff"/>
  </g>
  <g class="cloud3" opacity="0.9">
    <ellipse cx="0"  cy="52" rx="30" ry="13" fill="#ffffff"/>
    <ellipse cx="26" cy="45" rx="22" ry="11" fill="#ffffff"/>
  </g>

  <!-- 远处山丘 -->
  <path d="M0,420 Q140,350 300,420 Z" fill="#bfe6a8"/>
  <path d="M220,420 Q420,330 640,420 Z" fill="#aadb92"/>
  <path d="M520,420 Q680,360 800,415 L800,420 Z" fill="#bfe6a8"/>

  <!-- 草地与马路 -->
  <rect x="0" y="420" width="800" height="80" fill="#7cc35c"/>
  <rect x="0" y="449" width="800" height="51" fill="#4a4a52"/>
  <line class="roadDash" x1="-80" y1="476" x2="880" y2="476"
        stroke="#ffd54a" stroke-width="5" stroke-dasharray="40 30"/>

  <!-- 小草 -->
  <g stroke="#5da344" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M60,444 q3,-10 6,0"/>   <path d="M180,442 q3,-10 6,0"/>
    <path d="M330,445 q3,-10 6,0"/>  <path d="M470,441 q3,-10 6,0"/>
    <path d="M600,444 q3,-10 6,0"/>  <path d="M730,442 q3,-10 6,0"/>
  </g>

  <!-- 阴影 -->
  <ellipse cx="395" cy="455" rx="160" ry="9" fill="#000000" opacity="0.15"/>

  <!-- 速度线 -->
  <g stroke="#9fd4f0" stroke-width="4" stroke-linecap="round">
    <line class="s1" x1="140" y1="245" x2="210" y2="245"/>
    <line class="s2" x1="110" y1="290" x2="200" y2="290"/>
    <line class="s3" x1="150" y1="335" x2="215" y2="335"/>
  </g>

  <!-- ======== 自行车 ======== -->
  <!-- 后轮 -->
  <g>
    <circle cx="285" cy="395" r="52" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="285" cy="395" r="45" fill="none" stroke="#8a8a8a" stroke-width="3"/>
    <g class="w1" stroke="#9a9a9a" stroke-width="2.5">
      <line x1="241" y1="395" x2="329" y2="395"/>
      <line x1="263" y1="357" x2="307" y2="433"/>
      <line x1="263" y1="433" x2="307" y2="357"/>
    </g>
    <circle cx="285" cy="395" r="7" fill="#444444"/>
    <circle cx="285" cy="395" r="9" fill="none" stroke="#3a3a3a" stroke-width="3"/>
  </g>
  <!-- 前轮 -->
  <g>
    <circle cx="505" cy="395" r="52" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="505" cy="395" r="45" fill="none" stroke="#8a8a8a" stroke-width="3"/>
    <g class="w2" stroke="#9a9a9a" stroke-width="2.5">
      <line x1="461" y1="395" x2="549" y2="395"/>
      <line x1="483" y1="357" x2="527" y2="433"/>
      <line x1="483" y1="433" x2="527" y2="357"/>
    </g>
    <circle cx="505" cy="395" r="7" fill="#444444"/>
  </g>

  <!-- 链条 -->
  <g class="chain" stroke="#3a3a3a" stroke-width="2.5" stroke-dasharray="5 3" fill="none">
    <line x1="285" y1="386" x2="370" y2="385"/>
    <line x1="285" y1="404" x2="370" y2="411"/>
  </g>

  <!-- 远侧腿（在车架后面） -->
  <path fill="none" stroke="#b5620a" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" dur="0.9s" repeatCount="indefinite" values="
      M405,296 Q408,350 346,398;
      M405,296 Q414,332 353,381;
      M405,296 Q420,326 370,374;
      M405,296 Q424,338 387,381;
      M405,296 Q424,352 394,398;
      M405,296 Q420,360 387,415;
      M405,296 Q414,362 370,422;
      M405,296 Q408,356 353,415;
      M405,296 Q408,350 346,398"/>
  </path>

  <!-- 远侧曲柄 + 踏板 + 脚 -->
  <g class="crank">
    <line x1="370" y1="398" x2="346" y2="398" stroke="#555555" stroke-width="6" stroke-linecap="round"/>
    <g class="pedalA">
      <rect x="334" y="394" width="24" height="8" rx="3" fill="#333333"/>
      <ellipse cx="342" cy="392" rx="10" ry="5.5" fill="#b5620a"/>
    </g>
  </g>

  <!-- 车架 -->
  <g stroke="#e74c3c" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="370" y1="398" x2="390" y2="292"/>
    <line x1="390" y1="295" x2="478" y2="305"/>
    <line x1="370" y1="398" x2="478" y2="305"/>
    <line x1="285" y1="395" x2="390" y2="292"/>
    <line x1="285" y1="395" x2="368" y2="398"/>
    <line x1="478" y1="305" x2="505" y2="395"/>
    <line x1="478" y1="305" x2="486" y2="282"/>
    <line x1="486" y1="282" x2="466" y2="260" stroke="#555555" stroke-width="6"/>
  </g>
  <circle cx="466" cy="260" r="5" fill="#333333"/>
  <rect x="368" y="279" width="42" height="11" rx="5.5" fill="#333333" transform="rotate(-6 389 285)"/>

  <!-- 牙盘 -->
  <circle cx="370" cy="398" r="13" fill="none" stroke="#666666" stroke-width="4"/>

  <!-- ======== 鹈鹕 ======== -->
  <g class="bob">
    <!-- 尾羽 -->
    <path d="M352,236 Q316,218 306,240 Q330,246 350,256 Z" fill="#f4f4f4" stroke="#d9d9d9" stroke-width="2"/>
    <!-- 身体 -->
    <ellipse cx="398" cy="248" rx="58" ry="42" fill="#fdfdfd" stroke="#d9d9d9" stroke-width="2.5"/>
    <!-- 脖子 -->
    <path d="M412,226 C428,216 436,196 448,178" fill="none" stroke="#fdfdfd" stroke-width="17" stroke-linecap="round"/>
    <path d="M412,226 C428,216 436,196 448,178" fill="none" stroke="#e8e8e8" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- 头 -->
    <circle cx="452" cy="168" r="20" fill="#fdfdfd" stroke="#d9d9d9" stroke-width="2.5"/>
    <!-- 喷水孔式的眼睛 -->
    <circle cx="460" cy="160" r="3.4" fill="#222222"/>
    <circle cx="461.2" cy="158.8" r="1.1" fill="#ffffff"/>
    <!-- 上喙 -->
    <path d="M466,160 Q540,166 568,186 Q538,182 466,175 Z" fill="#f5a623"/>
    <!-- 喉囊 -->
    <path d="M466,176 C498,228 546,216 568,186 C540,192 500,188 466,182 Z" fill="#ef8f2e"/>
    <!-- 帽子 -->
    <path d="M432,156 Q452,131 472,154 Q452,146 432,156 Z" fill="#e74c3c"/>
    <circle cx="452" cy="134" r="6" fill="#ffffff"/>
    <!-- 围巾 -->
    <g class="scarf">
      <path d="M428,210 Q404,216 386,206" fill="none" stroke="#2f7fd1" stroke-width="8" stroke-linecap="round"/>
      <path d="M428,212 Q410,224 396,220" fill="none" stroke="#2568ab" stroke-width="7" stroke-linecap="round"/>
    </g>
    <circle cx="430" cy="210" r="7" fill="#2f7fd1"/>
    <!-- 翅膀（伸向车把） -->
    <path class="wing" d="M390,235 Q438,248 466,264 Q440,268 392,260 Q384,246 390,235 Z"
          fill="#f0f0f0" stroke="#d0d0d0" stroke-width="2"/>
  </g>

  <!-- 近侧腿（在身体前、牙盘后） -->
  <path fill="none" stroke="#e8830c" stroke-width="8" stroke-linecap="round">
    <animate attributeName="d" dur="0.9s" repeatCount="indefinite" values="
      M418,298 Q428,352 394,398;
      M418,298 Q427,358 387,415;
      M418,298 Q422,362 370,422;
      M418,298 Q416,356 353,415;
      M418,298 Q415,344 346,398;
      M418,298 Q420,330 353,381;
      M418,298 Q426,324 370,374;
      M418,298 Q428,336 387,381;
      M418,298 Q428,352 394,398"/>
  </path>

  <!-- 近侧曲柄 + 踏板 + 脚 -->
  <g class="crank">
    <line x1="370" y1="398" x2="394" y2="398" stroke="#666666" stroke-width="6" stroke-linecap="round"/>
    <g class="pedalB">
      <rect x="382" y="394" width="24" height="8" rx="3" fill="#444444"/>
      <ellipse cx="392" cy="392" rx="10" ry="5.5" fill="#e8830c"/>
    </g>
  </g>
</svg>
