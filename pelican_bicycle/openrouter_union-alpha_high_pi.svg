<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <style>
    .wheel { animation: spin 1.2s linear infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .bob { animation: bob 0.6s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    .legA { animation: pedalA 1.2s linear infinite; transform-origin: 470px 330px; }
    .legB { animation: pedalA 1.2s linear infinite; animation-delay: -0.6s; transform-origin: 470px 330px; }
    @keyframes pedalA {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .cloud1 { animation: drift1 14s linear infinite; }
    .cloud2 { animation: drift2 20s linear infinite; }
    @keyframes drift1 { from { transform: translateX(850px); } to { transform: translateX(-150px); } }
    @keyframes drift2 { from { transform: translateX(850px); } to { transform: translateX(-150px); } }
    .ground { animation: dash 0.5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -40; } }
  </style>

  <!-- background -->
  <rect width="800" height="500" fill="#bfe3f5"/>
  <circle cx="680" cy="80" r="45" fill="#ffd76e"/>
  <g class="cloud1">
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="0" cy="90" rx="40" ry="18"/>
      <ellipse cx="30" cy="80" rx="28" ry="16"/>
    </g>
  </g>
  <g class="cloud2">
    <g fill="#ffffff" opacity="0.75">
      <ellipse cx="0" cy="150" rx="50" ry="20"/>
      <ellipse cx="35" cy="140" rx="30" ry="15"/>
    </g>
  </g>
  <rect y="420" width="800" height="80" fill="#8fce7a"/>
  <line class="ground" x1="0" y1="430" x2="800" y2="430" stroke="#6aa85e" stroke-width="4"
        stroke-dasharray="20 20" stroke-linecap="round"/>

  <!-- bicycle -->
  <g class="bob">
    <!-- frame -->
    <path d="M 380 330 L 470 330 L 420 240 Z" fill="none" stroke="#e04f3f" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 470 330 L 560 330 L 470 240 L 420 240" fill="none" stroke="#e04f3f" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 470 240 L 460 205" stroke="#e04f3f" stroke-width="8" stroke-linecap="round"/>
    <!-- handlebar -->
    <path d="M 460 205 Q 450 195 435 200" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <!-- seat post + seat -->
    <line x1="420" y1="240" x2="415" y2="215" stroke="#333" stroke-width="6"/>
    <path d="M 395 212 Q 415 202 440 212" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
    <!-- pedals + crank -->
    <g class="wheel" style="transform-origin: 470px 330px;">
      <!-- crank + pedals -->
      <line x1="0" y1="-25" x2="0" y2="25" stroke="#444" stroke-width="5"/>
      <rect x="-9" y="-32" width="18" height="7" rx="2" fill="#222"/>
      <rect x="-9" y="25" width="18" height="7" rx="2" fill="#222"/>
    </g>
    <!-- wheels -->
    <g class="wheel" style="transform-origin: 380px 330px;">
      <circle cx="380" cy="330" r="65" fill="none" stroke="#222" stroke-width="8"/>
      <circle cx="380" cy="330" r="55" fill="none" stroke="#888" stroke-width="2"/>
      <line x1="380" y1="275" x2="380" y2="385" stroke="#888" stroke-width="2"/>
      <line x1="325" y1="330" x2="435" y2="330" stroke="#888" stroke-width="2"/>
      <line x1="341" y1="291" x2="419" y2="369" stroke="#888" stroke-width="2"/>
      <line x1="419" y1="291" x2="341" y2="369" stroke="#888" stroke-width="2"/>
    </g>
    <g class="wheel" style="transform-origin: 560px 330px;">
      <circle cx="560" cy="330" r="65" fill="none" stroke="#222" stroke-width="8"/>
      <circle cx="560" cy="330" r="55" fill="none" stroke="#888" stroke-width="2"/>
      <line x1="560" y1="275" x2="560" y2="385" stroke="#888" stroke-width="2"/>
      <line x1="505" y1="330" x2="615" y2="330" stroke="#888" stroke-width="2"/>
      <line x1="521" y1="291" x2="599" y2="369" stroke="#888" stroke-width="2"/>
      <line x1="599" y1="291" x2="521" y2="369" stroke="#888" stroke-width="2"/>
    </g>
  </g>

  <!-- pelican -->
  <g class="bob">
    <!-- far leg (behind) -->
    <g class="legB">
      <path d="M 455 250 Q 460 290 470 305" fill="none" stroke="#e0862f" stroke-width="10" stroke-linecap="round"/>
      <path d="M 470 305 L 462 328 M 470 305 L 482 326" stroke="#e0862f" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- tail -->
    <path d="M 300 235 Q 275 220 265 195 Q 295 205 315 220 Z" fill="#f7f7f7" stroke="#ddd" stroke-width="2"/>
    <!-- body -->
    <ellipse cx="370" cy="200" rx="95" ry="62" fill="#fdfdfd" stroke="#ddd" stroke-width="3"/>
    <!-- near leg -->
    <g class="legA">
      <path d="M 452 245 Q 458 290 470 302" fill="none" stroke="#f2a24a" stroke-width="10" stroke-linecap="round"/>
      <path d="M 470 302 L 462 326 M 470 302 L 483 324" stroke="#f2a24a" stroke-width="6" stroke-linecap="round"/>
    </g>
    <!-- neck -->
    <path d="M 300 170 Q 245 150 235 100" fill="none" stroke="#fdfdfd" stroke-width="34" stroke-linecap="round"/>
    <path d="M 300 170 Q 245 150 235 100" fill="none" stroke="#e8e8e8" stroke-width="30" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="230" cy="90" r="32" fill="#fdfdfd" stroke="#e8e8e8" stroke-width="3"/>
    <!-- big beak with pouch -->
    <path d="M 230 80 Q 190 88 155 100 L 225 112 Q 235 100 230 80 Z" fill="#f2b04a" stroke="#d99a2e" stroke-width="2"/>
    <path d="M 228 95 Q 200 130 222 128 Q 236 122 232 98 Z" fill="#e8953c"/>
    <!-- eye -->
    <circle cx="238" cy="80" r="4.5" fill="#222"/>
    <circle cx="240" cy="78" r="1.5" fill="#fff"/>
    <!-- wing -->
    <path d="M 330 185 Q 380 170 425 200 Q 385 235 330 215 Z" fill="#e9e9e9" stroke="#ccc" stroke-width="2"/>
    <path d="M 345 195 Q 385 188 415 202" fill="none" stroke="#c8c8c8" stroke-width="2"/>
    <!-- scarf -->
    <path d="M 250 108 Q 230 122 210 116" fill="none" stroke="#e04f3f" stroke-width="12" stroke-linecap="round"/>
    <path d="M 212 118 Q 195 135 200 155" fill="none" stroke="#e04f3f" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
