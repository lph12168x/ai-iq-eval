<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <title>骑自行车的鹈鹕</title>
  <desc>一只戴头盔的鹈鹕骑着自行车向前骑行，背景分层视差滚动。</desc>

  <!--
    动画分两层：
    · CSS  —— 只做位移（背景视差、车身起伏、虚线滚动），不需要 transform-origin，跨渲染器最稳。
    · SMIL —— 所有旋转与形变（车轮、曲柄、踏板、腿部），旋转中心直接写进动画里，不依赖 transform-box。
    腿部用双段骨骼 + 逆运动学解算，膝/踝骨长误差 0.000px，踩踏全程不脱节。
    踏板用 animateMotion 沿曲柄圆平移（rotate=0），所以脚掌始终水平。
  -->
  <style>
    /* 背景视差：每条带子画两份（x=0 与 x=900），整体平移 900px 后无缝衔接 */
    .band-clouds { animation: pan 60s linear infinite; }
    .band-hills  { animation: pan 34s linear infinite; }
    .band-bushes { animation: pan 13s linear infinite; }

    /* 路面黄线，虚线周期 200px，对应地面速度 455px/s */
    .road-dash   { animation: dash 0.44s linear infinite; }
    /* 链条节距 10px，对应链条速度 86.4px/s */
    .chain-run   { animation: chain 0.116s linear infinite; }

    .bob         { animation: bob 0.8s ease-in-out infinite; }

    .sp1 { animation: streak 1.2s linear infinite; }
    .sp2 { animation: streak 1.2s linear infinite 0.4s; }
    .sp3 { animation: streak 1.2s linear infinite 0.8s; }
    .du1 { animation: puff 0.9s ease-out infinite; }
    .du2 { animation: puff 0.9s ease-out infinite 0.3s; }
    .du3 { animation: puff 0.9s ease-out infinite 0.6s; }

    @keyframes pan    { from { transform: translateX(0); }      to { transform: translateX(-900px); } }
    @keyframes dash   { to   { stroke-dashoffset: -200; } }
    @keyframes chain  { to   { stroke-dashoffset: -10; } }
    @keyframes bob    { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes streak { 0%   { opacity: 0; transform: translateX(70px); }
                        25%  { opacity: 0.75; }
                        100% { opacity: 0; transform: translateX(-130px); } }
    @keyframes puff   { 0%   { opacity: 0.5; transform: translate(0, 0) scale(0.5); }
                        100% { opacity: 0;   transform: translate(-46px, -16px) scale(1.5); } }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#8fd3f4"/>
      <stop offset="0.55" stop-color="#c8ecff"/>
      <stop offset="1"    stop-color="#eefaff"/>
    </linearGradient>
    <linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8d99a"/>
      <stop offset="1" stop-color="#7cbf6b"/>
    </linearGradient>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffe680"/>
      <stop offset="0.6" stop-color="#ffd93d"/>
      <stop offset="1"   stop-color="#ffd93d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="billG" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0"   stop-color="#f8a93a"/>
      <stop offset="1"   stop-color="#eda01f"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f79f2c"/>
      <stop offset="1" stop-color="#e07d16"/>
    </linearGradient>

    <!-- ================= 视差背景带（每条宽 900，首尾切线水平，可无缝循环） ================= -->
    <g id="cloudband">
      <g fill="#ffffff" opacity="0.95">
        <ellipse cx="90"  cy="96"  rx="52" ry="23"/><ellipse cx="132" cy="82"  rx="40" ry="20"/><ellipse cx="174" cy="98"  rx="44" ry="17"/>
      </g>
      <g fill="#ffffff" opacity="0.7">
        <ellipse cx="330" cy="168" rx="42" ry="17"/><ellipse cx="366" cy="158" rx="31" ry="15"/><ellipse cx="398" cy="170" rx="35" ry="13"/>
      </g>
      <g fill="#ffffff" opacity="0.9">
        <ellipse cx="560" cy="62"  rx="38" ry="16"/><ellipse cx="592" cy="53"  rx="28" ry="14"/><ellipse cx="620" cy="64"  rx="32" ry="12"/>
      </g>
      <g fill="#ffffff" opacity="0.6">
        <ellipse cx="790" cy="132" rx="34" ry="14"/><ellipse cx="820" cy="124" rx="25" ry="12"/><ellipse cx="846" cy="134" rx="28" ry="11"/>
      </g>
    </g>

    <g id="hillband">
      <!-- 每 300px 一个圆顶，起止切线均为水平，拼接处无折角 -->
      <path fill="url(#hillG)"
            d="M0,412 C75,412 75,338 150,338 C225,338 225,412 300,412
               C375,412 375,332 450,332 C525,332 525,412 600,412
               C675,412 675,344 750,344 C825,344 825,412 900,412
               L900,430 L0,430 Z"/>
    </g>

    <g id="bushband">
      <!-- 路肩灌木草丛，坐在视平线上，故视差很慢 -->
      <g fill="#6cb055">
        <ellipse cx="70"  cy="424" rx="34" ry="15"/><ellipse cx="100" cy="418" rx="24" ry="12"/>
        <ellipse cx="300" cy="426" rx="28" ry="13"/><ellipse cx="326" cy="421" rx="20" ry="10"/>
        <ellipse cx="620" cy="423" rx="38" ry="16"/><ellipse cx="656" cy="417" rx="26" ry="12"/>
        <ellipse cx="830" cy="427" rx="26" ry="12"/>
      </g>
      <g stroke="#5c9c46" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M182,432 q4,-13 8,0"/><path d="M196,432 q4,-11 8,0"/>
        <path d="M455,432 q4,-13 8,0"/><path d="M469,432 q4,-10 8,0"/>
        <path d="M735,432 q4,-13 8,0"/><path d="M750,432 q4,-11 8,0"/>
      </g>
    </g>

    <g id="spokes" stroke="#c3cad2" stroke-width="2.2" stroke-linecap="round">
      <line x1="-46" y1="0" x2="46" y2="0"/>
      <line x1="-40" y1="-23" x2="40" y2="23"/>
      <line x1="-23" y1="-40" x2="23" y2="40"/>
      <line x1="0" y1="-46" x2="0" y2="46"/>
      <line x1="23" y1="-40" x2="-23" y2="40"/>
      <line x1="40" y1="-23" x2="-40" y2="23"/>
    </g>

    <g id="spider" stroke="#8b939c" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="-15" y1="0" x2="15" y2="0"/>
      <line x1="-7.5" y1="-13" x2="7.5" y2="13"/>
      <line x1="7.5" y1="-13" x2="-7.5" y2="13"/>
    </g>
  </defs>

  <!-- ============================================================ 背景 -->
  <rect width="900" height="520" fill="url(#sky)"/>

  <g>
    <circle cx="770" cy="84" r="86" fill="url(#sunG)" opacity="0.75"/>
    <circle cx="770" cy="84" r="40" fill="#ffe066"/>
  </g>

  <g class="band-clouds">
    <use href="#cloudband"/>
    <use href="#cloudband" x="900"/>
  </g>

  <g class="band-hills">
    <use href="#hillband"/>
    <use href="#hillband" x="900"/>
  </g>

  <!-- 草地路肩 -->
  <rect x="0" y="428" width="900" height="17" fill="#7cc35c"/>
  <g class="band-bushes">
    <use href="#bushband"/>
    <use href="#bushband" x="900"/>
  </g>

  <!-- ============================================================ 路面 -->
  <rect x="0" y="444" width="900" height="76" fill="#41454d"/>
  <rect x="0" y="444" width="900" height="4"  fill="#5b616b"/>
  <line class="road-dash" x1="-120" y1="484" x2="1020" y2="484"
        stroke="#f2cf4a" stroke-width="6" stroke-dasharray="110 90" stroke-linecap="round"/>

  <!-- 车与地面的接触阴影 -->
  <ellipse cx="462" cy="450" rx="182" ry="10" fill="#1b1f26" opacity="0.22"/>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.85">
    <line class="sp1" x1="120" y1="214" x2="196" y2="214"/>
    <line class="sp2" x1="92"  y1="300" x2="180" y2="300"/>
    <line class="sp3" x1="126" y1="352" x2="200" y2="352"/>
  </g>

  <!-- 后轮扬起的尘土 -->
  <g fill="#cbd7e2">
    <circle class="du1" cx="300" cy="440" r="9"/>
    <circle class="du2" cx="286" cy="446" r="7"/>
    <circle class="du3" cx="312" cy="446" r="6"/>
  </g>

  <!-- ============================================================ 自行车（后层） -->
  <!-- 远侧踏板 + 远侧脚（沿曲柄圆平移，rotate=0 所以脚掌始终水平） -->
  <g>
    <animateMotion dur="1.6s" repeatCount="indefinite" calcMode="paced"
                   path="M421,386 a34,34 0 0,1 -68,0 a34,34 0 0,1 68,0"/>
    <rect x="-13" y="0" width="26" height="7" rx="3.5" fill="#2f3238"/>
    <path d="M-9,-9 C0,-13 14,-9 19,-2 C11,3 -1,4 -9,1 Z" fill="#b16d1c"/>
  </g>

  <!-- 远侧腿（在车架后） -->
  <path fill="none" stroke="#b16d1c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="
        M397.0,263.0 L468.4,307.2 L421.0,386.0;
        M397.0,263.0 L478.5,283.2 L431.0,362.0;
        M397.0,263.0 L481.0,263.7 L455.0,352.0;
        M397.0,263.0 L480.7,270.0 L479.0,362.0;
        M397.0,263.0 L474.6,295.1 L489.0,386.0;
        M397.0,263.0 L458.3,320.4 L479.0,410.0;
        M397.0,263.0 L450.0,328.1 L455.0,420.0;
        M397.0,263.0 L457.0,321.8 L431.0,410.0;
        M397.0,263.0 L468.4,307.2 L421.0,386.0"/>
  </path>

  <!-- 远侧曲柄臂（指向左，顺时针转） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 455 386" to="360 455 386"
                      dur="1.6s" repeatCount="indefinite"/>
    <line x1="455" y1="386" x2="421" y2="386" stroke="#3b3f46" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- ============================================================ 车轮 -->
  <g>
    <circle cx="330" cy="386" r="54" fill="none" stroke="#262a30" stroke-width="9"/>
    <circle cx="330" cy="386" r="46" fill="none" stroke="#b9c0c7" stroke-width="3.5"/>
    <g transform="translate(330,386)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <use href="#spokes"/>
      </g>
    </g>
    <circle cx="330" cy="386" r="7" fill="#4a4f57"/>
  </g>
  <g>
    <circle cx="600" cy="386" r="54" fill="none" stroke="#262a30" stroke-width="9"/>
    <circle cx="600" cy="386" r="46" fill="none" stroke="#b9c0c7" stroke-width="3.5"/>
    <g transform="translate(600,386)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <use href="#spokes"/>
      </g>
    </g>
    <circle cx="600" cy="386" r="7" fill="#4a4f57"/>
  </g>

  <!-- ============================================================ 传动 -->
  <g stroke="#3b3f46" stroke-width="3" fill="none">
    <line class="chain-run" x1="330" y1="375" x2="455" y2="364" stroke-dasharray="6 4"/>
    <line class="chain-run" x1="330" y1="397" x2="455" y2="408" stroke-dasharray="6 4"/>
  </g>
  <circle cx="330" cy="386" r="11" fill="none" stroke="#5a616b" stroke-width="4"/>
  <circle cx="455" cy="386" r="22" fill="none" stroke="#6d757f" stroke-width="5"/>
  <g transform="translate(455,386)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.6s" repeatCount="indefinite"/>
      <use href="#spider"/>
    </g>
  </g>

  <!-- ============================================================ 车架 -->
  <g stroke="#16a085" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="330" y1="386" x2="455" y2="386"/>                   <!-- 后下叉 -->
    <line x1="455" y1="386" x2="425" y2="284"/>                   <!-- 座管 -->
    <line x1="330" y1="386" x2="424" y2="288"/>                   <!-- 后上叉 -->
    <line x1="455" y1="386" x2="600" y2="318"/>                   <!-- 下管 -->
    <line x1="424" y1="286" x2="590" y2="272"/>                   <!-- 上管 -->
    <line x1="592" y1="268" x2="602" y2="320" stroke-width="9"/>  <!-- 头管 -->
    <line x1="602" y1="320" x2="600" y2="386" stroke="#4a4f57"/>  <!-- 前叉 -->
  </g>

  <!-- 车把 -->
  <g fill="none" stroke="#4a4f57" stroke-linecap="round">
    <line x1="590" y1="272" x2="586" y2="250" stroke-width="6"/>
    <path d="M536,240 C560,230 594,230 618,240 L626,249" stroke-width="8"/>
  </g>
  <line x1="532" y1="240" x2="562" y2="236" stroke="#2f3238" stroke-width="12" stroke-linecap="round"/>

  <!-- 车座 -->
  <path d="M376,268 C384,259 428,257 438,265 C443,270 440,277 432,278 L382,279 C373,279 371,273 376,268 Z"
        fill="#2f3238"/>
  <path d="M382,268 C392,263 424,262 434,266" fill="none" stroke="#5a616b" stroke-width="2.5"/>

  <!-- ============================================================ 鹈鹕 -->
  <!-- 远侧翅膀：折起的翼尖从背脊上露出一点，做出景深 -->
  <path d="M356,170 C374,146 404,137 432,146 C422,160 402,167 380,169 Z"
        fill="#e8e3d6" stroke="#d3ccbd" stroke-width="2" stroke-linejoin="round"/>

  <g class="bob">
   <g>
    <animateTransform attributeName="transform" type="rotate"
                      values="-1.1 405 276; 1.1 405 276; -1.1 405 276"
                      dur="1.6s" repeatCount="indefinite"/>

    <!-- 尾羽 -->
    <path d="M336,184 C302,172 262,176 236,194 C252,200 264,210 270,222
             C280,218 290,222 294,232 C308,226 324,230 338,236 Z"
          fill="#f4f1e9" stroke="#dcd6c8" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 身体 -->
    <ellipse cx="392" cy="214" rx="71" ry="53" fill="#fdfcf9" stroke="#dcd6c8" stroke-width="2.5"/>
    <!-- 胸腹明暗 -->
    <path d="M338,190 C328,216 342,242 370,254" fill="none" stroke="#f2eee3" stroke-width="9"
          stroke-linecap="round" opacity="0.85"/>
    <path d="M326,236 C352,262 404,266 442,246" fill="none" stroke="#e6e0d2" stroke-width="3"/>
    <path d="M346,250 C374,264 414,264 440,248" fill="none" stroke="#efeade" stroke-width="2.5" opacity="0.8"/>

    <!-- 脖子 -->
    <path d="M406,178 C442,164 474,148 498,126 L506,140 C480,166 448,194 420,216 Z"
          fill="#fdfcf9" stroke="#dcd6c8" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- 头 -->
    <ellipse cx="516" cy="110" rx="36" ry="32" fill="#fdfcf9" stroke="#dcd6c8" stroke-width="2.5"/>

    <!-- 喙与喉囊：整组随呼吸轻晃 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 544 96; 1.5 544 96; 0 544 96" dur="1.6s" repeatCount="indefinite"/>

      <!-- 喉囊：最深处在喉部，向喙尖收成细长楔形，不是圆兜 -->
      <path d="M530,126 C534,148 552,158 574,158 C618,156 670,130 698,101
               C660,110 596,108 542,102 Z"
            fill="url(#pouchG)" stroke="#cf7212" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- 囊壁皱纹 -->
      <g stroke="#c8690c" stroke-width="1.8" fill="none" opacity="0.5">
        <path d="M580,152 C580,140 576,132 570,126"/>
        <path d="M612,138 C608,129 602,122 596,118"/>
        <path d="M642,125 C638,117 632,112 626,108"/>
        <path d="M670,112 C666,106 662,103 656,100"/>
      </g>
      <!-- 囊壁上方的高光 -->
      <path d="M558,112 C602,118 656,116 690,106" fill="none" stroke="#ffc76b"
            stroke-width="5" stroke-linecap="round" opacity="0.32"/>
      <!-- 下喙骨线，把喙和囊分开 -->
      <path d="M542,102 C596,108 660,110 698,101" fill="none" stroke="#b85c07"
            stroke-width="2.2" stroke-linecap="round"/>

      <!-- 上喙：有厚度的刀片状，末端与囊尖汇合 -->
      <path d="M538,84 C592,80 646,82 690,87 C700,88 704,95 698,101
               C691,96 684,94 676,93 C632,88 586,90 542,100 Z"
            fill="url(#billG)" stroke="#cf7212" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M564,86 C612,84 654,87 682,92" fill="none" stroke="#ffd58a"
            stroke-width="2.6" opacity="0.7"/>
      <ellipse cx="572" cy="88" rx="5" ry="2.2" fill="#c96f12"/>
    </g>

    <!-- 眼睛 -->
    <circle cx="519" cy="100" r="8"   fill="#f6a623"/>
    <circle cx="519" cy="100" r="6.2" fill="#222831"/>
    <circle cx="521" cy="98" r="2.1" fill="#ffffff"/>
    <path d="M496,130 C512,140 530,141 542,134" fill="none" stroke="#ece7db"
          stroke-width="3.5" stroke-linecap="round"/>

    <!-- 头盔 -->
    <path d="M474,88 C474,42 554,42 554,88 C532,74 494,74 474,88 Z" fill="#e74c3c"/>
    <path d="M514,46 C522,46 528,68 528,88 L508,88 C508,68 504,46 514,46 Z" fill="#ffffff" opacity="0.92"/>
    <path d="M490,68 C498,63 508,61 516,61 C524,61 534,63 542,68" fill="none"
          stroke="#b93a2c" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M551,84 C562,84 572,89 576,95 C566,95 557,93 550,91 Z" fill="#e74c3c" stroke="#b93a2c" stroke-width="1.5"/>
    <path d="M480,86 C483,108 491,123 503,134" fill="none" stroke="#3b3f46"
          stroke-width="3" stroke-linecap="round"/>
    <circle cx="504" cy="135" r="3.5" fill="#3b3f46"/>

    <!-- 围巾：领口 + 两条飘带 -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-6 445 156; 9 445 156; -6 445 156"
                        dur="1.1s" repeatCount="indefinite"
                        calcMode="spline" keyTimes="0;0.5;1"
                        keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      <path d="M428,148 C410,138 372,128 340,132 C352,142 346,154 336,162
               C372,164 416,160 444,156 Z" fill="#2568ab"/>
      <path d="M444,143 C410,134 370,128 338,140 C336,148 332,154 330,160
               C366,156 412,153 444,157 Z" fill="#2f7fd1"/>
      <path d="M438,148 C412,144 386,140 366,139" fill="none" stroke="#58a6e8"
            stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <rect x="-20" y="-9" width="40" height="18" rx="8"
            transform="translate(452,156) rotate(58)" fill="#3a8ee0"/>
    </g>
   </g>
  </g>

  <!-- 近侧翅膀：从肩部下伸抓住车把，绕握把端点微微扇动（肩端藏在身体下，看不出接缝） -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      values="0 550 240; 1.4 550 240; 0 550 240" dur="0.8s" repeatCount="indefinite"/>
    <path d="M412,168
             C452,176 496,194 534,218
             C548,227 558,234 558,241
             C558,248 549,252 540,249
             C512,236 480,222 448,211
             C424,203 402,197 396,186
             C390,176 398,165 412,168 Z"
          fill="#f4f1e9" stroke="#d3ccbd" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 覆羽与飞羽分界 -->
    <path d="M430,190 C468,200 508,218 536,238" fill="none" stroke="#d3ccbd" stroke-width="2.5"/>
    <path d="M462,206 C494,218 522,232 542,246" fill="none" stroke="#d3ccbd" stroke-width="2" opacity="0.85"/>
    <path d="M494,222 C516,232 534,242 546,249" fill="none" stroke="#d3ccbd" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- ============================================================ 自行车（前层） -->
  <!-- 近侧腿（在鹈鹕身体之前） -->
  <path fill="none" stroke="#f5a623" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="
        M405.0,266.0 L484.2,294.1 L489.0,386.0;
        M405.0,266.0 L470.6,318.4 L479.0,410.0;
        M405.0,266.0 L461.4,328.2 L455.0,420.0;
        M405.0,266.0 L465.2,324.6 L431.0,410.0;
        M405.0,266.0 L475.4,311.8 L421.0,386.0;
        M405.0,266.0 L486.0,288.2 L431.0,362.0;
        M405.0,266.0 L489.0,266.5 L455.0,352.0;
        M405.0,266.0 L488.9,270.5 L479.0,362.0;
        M405.0,266.0 L484.2,294.1 L489.0,386.0"/>
  </path>

  <!-- 近侧曲柄臂（指向右，与远侧同相） -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 455 386" to="360 455 386"
                      dur="1.6s" repeatCount="indefinite"/>
    <line x1="455" y1="386" x2="489" y2="386" stroke="#4a4f57" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 近侧踏板 + 近侧脚 -->
  <g>
    <animateMotion dur="1.6s" repeatCount="indefinite" calcMode="paced"
                   path="M489,386 a34,34 0 0,1 -68,0 a34,34 0 0,1 68,0"/>
    <rect x="-13" y="1" width="26" height="7" rx="3.5" fill="#4a4f57"/>
    <path d="M-9,-10 C0,-14 15,-10 20,-2 C12,4 -1,5 -9,2 Z" fill="#f5a623"
          stroke="#d98a12" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
