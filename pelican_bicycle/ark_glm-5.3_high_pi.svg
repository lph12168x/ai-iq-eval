<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <title>Pelican riding a bicycle</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#e6f7ff"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="450" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="700" cy="70" r="34" fill="#ffd54d" opacity="0.9">
    <animate attributeName="r" values="34;37;34" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <g>
      <ellipse cx="120" cy="80" rx="42" ry="16"/>
      <ellipse cx="150" cy="66" rx="30" ry="13"/>
      <ellipse cx="420" cy="120" rx="34" ry="12"/>
      <ellipse cx="445" cy="108" rx="24" ry="10"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -420 0" dur="24s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="560" cy="80" rx="42" ry="16"/>
      <ellipse cx="590" cy="66" rx="30" ry="13"/>
      <ellipse cx="860" cy="120" rx="34" ry="12"/>
      <ellipse cx="885" cy="108" rx="24" ry="10"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -420 0" dur="24s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ground & road -->
  <rect y="375" width="800" height="75" fill="#7ec850"/>
  <rect y="373" width="800" height="26" fill="#6f6f6f"/>
  <line x1="0" y1="386" x2="800" y2="386" stroke="#f5f5f5" stroke-width="3" stroke-dasharray="30 40">
    <animate attributeName="stroke-dashoffset" values="0;70" dur="0.15s" repeatCount="indefinite"/>
  </line>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="150" y1="250" x2="100" y2="250">
      <animate attributeName="x1" values="170;90" dur="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="130" y1="300" x2="70" y2="300">
      <animate attributeName="x1" values="150;60" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- rear wheel -->
  <g>
    <circle cx="240" cy="320" r="55" fill="none" stroke="#2f2f2f" stroke-width="7"/>
    <circle cx="240" cy="320" r="47" fill="none" stroke="#b8b8b8" stroke-width="3"/>
    <g stroke="#9a9a9a" stroke-width="2.5">
      <line x1="193" y1="320" x2="287" y2="320"/>
      <line x1="240" y1="273" x2="240" y2="367"/>
      <line x1="206.8" y1="286.8" x2="273.2" y2="353.2"/>
      <line x1="273.2" y1="286.8" x2="206.8" y2="353.2"/>
      <animateTransform attributeName="transform" type="rotate" values="0 240 320; 360 240 320" dur="0.75s" repeatCount="indefinite"/>
    </g>
    <circle cx="240" cy="320" r="6" fill="#444"/>
  </g>

  <!-- front wheel -->
  <g>
    <circle cx="570" cy="320" r="55" fill="none" stroke="#2f2f2f" stroke-width="7"/>
    <circle cx="570" cy="320" r="47" fill="none" stroke="#b8b8b8" stroke-width="3"/>
    <g stroke="#9a9a9a" stroke-width="2.5">
      <line x1="523" y1="320" x2="617" y2="320"/>
      <line x1="570" y1="273" x2="570" y2="367"/>
      <line x1="536.8" y1="286.8" x2="603.2" y2="353.2"/>
      <line x1="603.2" y1="286.8" x2="536.8" y2="353.2"/>
      <animateTransform attributeName="transform" type="rotate" values="0 570 320; 360 570 320" dur="0.75s" repeatCount="indefinite"/>
    </g>
    <circle cx="570" cy="320" r="6" fill="#444"/>
  </g>

  <!-- far leg (behind frame) -->
  <path fill="none" stroke="#c9763f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
        d="M335 235 L395 260 L375 325 L390 325">
    <animate attributeName="d" dur="0.75s" repeatCount="indefinite" calcMode="linear"
      values="M335 235 L395 260 L375 325 L390 325;
              M335 235 L399.9 237.7 L383.8 303.8 L398.8 303.8;
              M335 235 L399.5 227.2 L405 295 L420 295;
              M335 235 L399.7 241.2 L426.2 303.8 L441.2 303.8;
              M335 235 L384.4 278.4 L435 325 L450 325;
              M335 235 L380.3 288.8 L426.2 346.2 L441.2 346.2;
              M335 235 L369.9 293.2 L405 355 L420 355;
              M335 235 L383.6 278.2 L383.8 346.2 L398.8 346.2;
              M335 235 L395 260 L375 325 L390 325"/>
  </path>

  <!-- crank & far pedal (behind frame) -->
  <g>
    <line x1="375" y1="325" x2="435" y2="325" stroke="#555" stroke-width="6" stroke-linecap="round"/>
    <circle cx="375" cy="325" r="6" fill="#3a3a3a"/>
    <animateTransform attributeName="transform" type="rotate" values="0 405 325; 360 405 325" dur="0.75s" repeatCount="indefinite"/>
  </g>

  <!-- frame -->
  <g fill="none" stroke="#e04f3f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M347 218 L405 325"/>
    <path d="M545 222 L405 325"/>
    <path d="M350 222 L543 224"/>
    <path d="M240 320 L405 325"/>
    <path d="M240 320 L347 218"/>
    <path d="M545 222 L570 320"/>
    <path d="M545 222 L538 198"/>
    <path d="M538 198 Q558 196 560 212"/>
  </g>
  <!-- chain & chainring -->
  <circle cx="405" cy="325" r="14" fill="none" stroke="#555" stroke-width="4"/>
  <line x1="240" y1="315" x2="405" y2="312" stroke="#444" stroke-width="3" stroke-dasharray="5 4"/>
  <line x1="240" y1="325" x2="405" y2="337" stroke="#444" stroke-width="3" stroke-dasharray="5 4"/>

  <!-- saddle -->
  <path d="M328 212 Q347 205 368 212 Q347 223 328 212 Z" fill="#6b4a2f"/>

  <!-- pelican -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 3; 0 0" dur="0.375s" repeatCount="indefinite"/>

    <!-- tail feathers -->
    <path d="M292 155 L242 132 L258 168 L240 190 L295 188 Z" fill="#e8e2d2" stroke="#c9c2b0" stroke-width="2"/>

    <!-- body -->
    <ellipse cx="350" cy="170" rx="78" ry="50" fill="#f7f4ec" stroke="#d8d2c4" stroke-width="2.5" transform="rotate(-8 350 170)"/>

    <!-- neck -->
    <path d="M388 148 Q438 128 462 100" fill="none" stroke="#f7f4ec" stroke-width="26" stroke-linecap="round"/>

    <!-- head -->
    <circle cx="472" cy="100" r="19" fill="#f7f4ec"/>
    <!-- crest -->
    <path d="M462 84 Q452 72 458 68 M468 82 Q464 68 470 64" fill="none" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>

    <!-- beak: upper mandible -->
    <path d="M484 90 L592 130 L486 108 Z" fill="#f5a63b" stroke="#d68a20" stroke-width="2" stroke-linejoin="round"/>
    <!-- beak: pouch -->
    <path d="M486 106 Q562 172 592 130 L488 114 Z" fill="#f0813c" stroke="#cc6420" stroke-width="2" stroke-linejoin="round">
      <animate attributeName="d" dur="2s" repeatCount="indefinite"
        values="M486 106 Q562 172 592 130 L488 114 Z;
                M486 106 Q562 184 592 130 L488 114 Z;
                M486 106 Q562 172 592 130 L488 114 Z"/>
    </path>

    <!-- eye -->
    <circle cx="474" cy="95" r="4" fill="#2b2b2b"/>
    <circle cx="475.5" cy="93.5" r="1.3" fill="#ffffff"/>

    <!-- wing on body -->
    <path d="M330 162 Q404 148 414 186 Q372 208 324 192 Z" fill="#e8e2d2" stroke="#c9c2b0" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" values="0 335 165; -7 335 165; 0 335 165; 4 335 165; 0 335 165" dur="0.75s" repeatCount="indefinite"/>
    </path>

    <!-- wing arm reaching handlebar -->
    <path d="M392 164 Q470 172 552 204" fill="none" stroke="#f7f4ec" stroke-width="15" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 392 164; -2 392 164; 0 392 164" dur="0.75s" repeatCount="indefinite"/>
    </path>
    <circle cx="552" cy="204" r="8" fill="#f5a63b"/>
  </g>

  <!-- near leg -->
  <path fill="none" stroke="#e8935a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
        d="M335 235 L384.4 278.4 L435 325 L450 325">
    <animate attributeName="d" dur="0.75s" repeatCount="indefinite" calcMode="linear"
      values="M335 235 L384.4 278.4 L435 325 L450 325;
              M335 235 L380.3 288.8 L426.2 346.2 L441.2 346.2;
              M335 235 L369.9 293.2 L405 355 L420 355;
              M335 235 L383.6 278.2 L383.8 346.2 L398.8 346.2;
              M335 235 L395 260 L375 325 L390 325;
              M335 235 L399.9 237.7 L383.8 303.8 L398.8 303.8;
              M335 235 L399.5 227.2 L405 295 L420 295;
              M335 235 L399.7 241.2 L426.2 303.8 L441.2 303.8;
              M335 235 L384.4 278.4 L435 325 L450 325"/>
  </path>

  <!-- near pedal (front) -->
  <g>
    <circle cx="435" cy="325" r="6.5" fill="#3a3a3a"/>
    <animateTransform attributeName="transform" type="rotate" values="0 405 325; 360 405 325" dur="0.75s" repeatCount="indefinite"/>
  </g>
</svg>
